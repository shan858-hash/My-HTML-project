<!DOCTYPE html>
<html>
<head>
	<title> Periodic Table</title>
	<style>
		table {
			border-collapse: collapase;
			text-align: center;
			margin: 210px auto;
		}
		td,th {
		border :1px solid black;
		width: 70px;
		height: 60px;
		padding: 5px;
		font-weight: bold;
		}
		.center-title {
			font-size: 18px;
			text-align: center;
			vertical-align: middle;
		}
	</style>
</head>
<body>
	<table> 
		<tr>
			<th class="header_cell">I</th>
			<th class="header_cell">II</th>

			<th class="header_cell">V</th>
			<th class="header_cell">VI</th>
			<th class="header_cell">VII</th>
		</tr>
		
		<tr>
			<td class="Black">H</td>
			<td></td>
			<td colspan="3" rowspan="3" class="center-title" >Periodic table<br> of element</td>
			<td></td>
			<td class="Black">He</td>
		</tr>
		
		<tr>
			<td>Li</td>
			<td>Be</td>
			<td>B</td>
			<td class="Black">Ne</td>
		</tr>
		
		<tr>
			<td>Na</td>
			<td>Mg</td>
			<td>Al</td>
			<td class="Black">Ar</td>
		</tr>
		
		<tr>
			<td>K</td>
			<td>Ca</td>
			<td>Sc</td>
			<td>V</td>
			<td>Ti</td>
			<td>Ga</td>
			<td class ="Black">Kr</td>
		</tr>
		
	</table>
</body>
</html>
